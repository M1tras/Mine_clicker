<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mine Clicker</title>
    <link rel="icon" type="image/png" href="/Textures/Assets/boulder.png">
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <nav id="navbar">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Language</li>
            </ul>
        </nav>
    </header>
    <!-- Main Clicker -->
    <section id="main-page">
        <div class="sign">
            <br><br><br>
            <h1>MINE CLICKER!</h1>
            <h2 id="counting">0</h2>
        </div><br>
        <div id="rock">
            <button id="button">
                <img src="./Textures/Assets/boulder.png" alt="Rock">
            </button>
        </div>
    </section>
    <div class="separator"></div>
    <!-- Store -->
    <section>
        <div id="store">
            <div class="store-sign">
                <h2>.Store.</h2>
            </div><br><br>
            <div class="store-items">
                <div class="item-pickaxe">
                    <img src="./Textures/Icons/pickaxe.png">
                    <button class="pickaxe-buy">Buy</button>
                </div>
            </div>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
