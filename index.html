<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mine Clicker</title>
    <link rel="icon" type="image/png" href="/Textures/Assets/boulder.png">
</head>
<body>
    <!-- Header / Navbar -->
    <header>
        <nav id="navbar">
            <ul>
                <li><button=><a href="index.html">Home</a></button></li>
                <li><a href="login.html">login</a></li>
                <li>Language</li>
                <li><button onclick="window.resetGame()" class="reset-btn">Alvin button</button></li>
            </ul>
        </nav>
    </header>
    <!-- Main Clicker -->
    <section id="main-page">
        <div class="rock-n-scroll">
            <div class="stats-scroll">
                <strong>
                    <h1>Ores</h1>
                    <p>Coal: <label class="ore-oreCoal-display"></label></p>
                    <p>Iron: <label class="ore-oreIron-display"></label></p>
                    <p>Lithium: <label class="ore-oreLithium-display"></label></p>
                    <p>Gold: <label class="ore-oreGold-display"></label></p>
                    <p>Diamond: <label class="ore-oreDiamond-display"></label></p>
                    <p>Obsidian: <label class="ore-oreObsidian-display"></label></p>
                    <p>Oil: <label class="ore-oreOil-display"></label></p>
                    <p>Diddyum: <label class="ore-oreDiddyum-display"></label></p>
                </strong>
            </div>
            <div class="options-menu">
                <button id="crafting-btn">Crafting</button>
            </div>
            <div class="sign">
                <br><br><br>
                <h1>MINE CLICKER!</h1>
                <h2 id="counting">0</h2>
            </div>
        </div>
        <div class="rock-shine">
            <div id="rock">
                <button id="button">
                    <img src="./Textures/Assets/boulder.png" alt="Rock">
                </button>
            </div>
        </div>
    </section>
    <div class="separator"></div>
    <!-- Store -->
    <section>
        <div id="store">
            <div class="store-sign">
                <h2>.Store.</h2>
            </div><br><br>
            <div class="store-items">
                <div class="store-grid"></div>
            </div>
        </div>
    </section>
    <template id="store-card-template">
        <div class="store-card">
            <img class="store-icon" alt="">
            <div class="store-info">
                <h3 class="store-item-name"></h3>
                <p class="store-item-owned"></p>
                <p class="store-item-pps click-bonus"></p>
                <p class="store-item-pps production-info"></p>
                <p class="store-item-pps drill-info"></p>
                <p class="store-item-pps miner-hut-info"></p>
                <button class="card-buy">Buy</button>
            </div>
        </div>
    </template>

    <script type="module" src="index.js"></script>
</body>
</html>
